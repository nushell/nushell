[package]
authors.workspace = true
description = "Nushell utility functions"
edition.workspace = true
license.workspace = true
name = "nu-utils"
repository = "https://github.com/nushell/nushell/tree/main/crates/nu-utils"
rust-version.workspace = true
version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "utils"
path = "src/main.rs"
bench = false

[lib]
bench = false

[dependencies]
byteyarn.workspace = true
crossterm = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["debug"]}
fancy-regex = { workspace = true }
interprocess = { workspace = true, optional = true }
lean_string.workspace = true
log = { workspace = true }
lscolors = { workspace = true, default-features = false, features = ["nu-ansi-term"] }
memchr = { workspace = true }
num-format = { workspace = true }
parking_lot =  { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strip-ansi-escapes = { workspace = true }
sys-locale = "0.3"
unicase = "2.9.0"

[features]
default = ["os"]
os = ["crossterm"]
# Local sockets (Unix domain sockets, Windows named pipes) for talking to a child process.
local-socket = ["dep:interprocess", "dep:windows-sys"]

[target.'cfg(windows)'.dependencies]
crossterm_winapi = "0.9"
windows-sys = { workspace = true, optional = true, features = ["Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, default-features = false, features = ["user", "fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = { workspace = true }

[lints]
workspace = true
