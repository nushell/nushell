[package]
authors.workspace = true
description = "Composable terminal UI commands for Nushell"
repository = "https://github.com/nushell/nushell/tree/main/crates/nu-tui"
edition.workspace = true
license.workspace = true
name = "nu-tui"
rust-version.workspace = true
version.workspace = true

[lib]
bench = false

[[test]]
name = "tests"
path = "tests/main.rs"
harness = false

[lints]
workspace = true

[dependencies]
nu-protocol = { workspace = true, features = ["os"] }
nu-engine = { workspace = true, features = ["os"] }
nu-command = { workspace = true, features = ["os"] }
nu-color-config.workspace = true
nu-explore.workspace = true
nu-utils.workspace = true
nu-system.workspace = true
nu-ansi-term.workspace = true
nu-glob.workspace = true

ansi-str = { workspace = true }
base64 = { workspace = true }
crossterm = { workspace = true }
devicons = { workspace = true }
image = { workspace = true }
mime_guess = { workspace = true }
nucleo-matcher = { workspace = true }
ratatui = { workspace = true }
ratatui-image = { workspace = true }
serde = { workspace = true, features = ["derive"] }
typetag = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(target_family = "unix")'.dependencies]
nix = { workspace = true, default-features = false, features = ["mman"] }
umask = { workspace = true }

[dev-dependencies]
nu-cmd-lang = { workspace = true, features = ["os"] }
nu-test-support = { path = "../nu-test-support", features = ["os"] }
