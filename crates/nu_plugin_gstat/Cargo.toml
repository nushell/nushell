[package]
authors.workspace = true
description = "A git status plugin for Nushell"
repository = "https://github.com/nushell/nushell/tree/main/crates/nu_plugin_gstat"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
name = "nu_plugin_gstat"
version.workspace = true

[lib]
doctest = false
bench = false

[[bin]]
name = "nu_plugin_gstat"
bench = false

[dependencies]
nu-plugin.workspace = true
nu-protocol.workspace = true

# Build libgit2 in. A system libgit2, such as Homebrew's, loads openssl, libssh2 and llhttp every
# time the plugin starts (about 10ms on macOS). Packagers who want the shared library can build
# with LIBGIT2_NO_VENDOR=1.
git2 = { version = "0.21.0", features = ["vendored-libgit2"] }

[dev-dependencies]
tempfile = { workspace = true }
