on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - 'patch-release-*'

name: Continuous Integration

permissions:
  contents: read

env:
  OS_NAMES: '{"Windows":"windows","Linux":"linux","macOS":"macos"}'
  ARCH_NAMES: '{"X86":"x86","X64":"x86_64","ARM":"arm","ARM64":"aarch64"}'
  EXE_SUFFIXES: '{"Windows":".exe","Linux":"","macOS":""}'
  NU_LOG_LEVEL: DEBUG
  NU_TEST_SKIP_DEPS_BUILD: true
  CLIPPY_OPTIONS: "-D warnings"
  NUSHELL_CARGO_PROFILE: ci
  MAIN_OPTIONS: --workspace --all-targets
  WASM_OPTIONS: >-
    --no-default-features
    --target wasm32-unknown-unknown
    -p nu-cmd-base
    -p nu-cmd-extra
    -p nu-cmd-lang
    -p nu-color-config
    -p nu-command
    -p nu-derive-value
    -p nu-engine
    -p nu-glob
    -p nu-json
    -p nu-parser
    -p nu-path
    -p nu-pretty-hex
    -p nu-protocol
    -p nu-std
    -p nu-system
    -p nu-table
    -p nu-term-grid
    -p nu-utils
    -p nuon

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cargo:
    # Do not run CI on draft PRs or on the lower layers of stacked PRs
    if: &run_ci >-
      !github.event.pull_request.draft &&
      (
        github.event.pull_request.stack == null ||
        github.event.pull_request.stack.position ==
          github.event.pull_request.stack.size
      )
    name: "`cargo` in ${{ matrix.workspace.name }} (${{ matrix.target.name }})"
    strategy:
      fail-fast: true
      matrix:
        target:
          # Pinning to Ubuntu 22.04 because building on newer Ubuntu versions causes linux-gnu
          # builds to link against a too-new-for-many-Linux-installs glibc version. Consider
          # revisiting this when 22.04 is closer to EOL (June 2027)
          - name: Ubuntu
            host: incredibuild-ubuntu-2204
            target: x86_64-unknown-linux-gnu
            options: MAIN_OPTIONS
            steps: [fmt, clippy, build, test, doctest, artifact]
          - name: Windows
            host: incredibuild-windows-2022
            target: x86_64-pc-windows-msvc
            options: MAIN_OPTIONS
            steps: [fmt, clippy, build, test, doctest, artifact]
          - name: MacOS
            host: macos-latest
            target: x86_64-apple-darwin
            options: MAIN_OPTIONS
            steps: [fmt, clippy, build, test, doctest, artifact]
          - name: WASM
            host: incredibuild-ubuntu-2204
            target: wasm32-unknown-unknown
            options: WASM_OPTIONS
            steps: [build, check]

        workspace:
          - name: root
            path: ./
            profile: ci
            skip: []
          - name: nu-parser/fuzz
            path: ./crates/nu-parser/fuzz
            profile: dev
            skip: [build, test, doctest, artifact]
          - name: nu-path/fuzz
            path: ./crates/nu-path/fuzz
            profile: dev
            skip: [build, test, doctest, artifact]

        exclude:
          - target: { name: WASM }
            workspace: { name: nu-parser/fuzz }
          - target: { name: WASM }
            workspace: { name: nu-path/fuzz }
    
    runs-on: ${{ matrix.target.host }}

    steps:
      - &checkout_repo
        name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust Toolchain
        run: rustup target add ${{ matrix.target.target }}
        working-directory: ${{ matrix.workspace.path }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.workspace.path }} -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: cargo fmt
        if: contains(matrix.target.steps, 'fmt') && !contains(matrix.workspace.skip, 'fmt')
        working-directory: ${{ matrix.workspace.path }}
        run: |
          rustup component add rustfmt
          cargo fmt --all --check

      - name: cargo check
        if: contains(matrix.target.steps, 'check') && !contains(matrix.workspace.skip, 'check')
        working-directory: ${{ matrix.workspace.path }}
        run: cargo --config "${{ github.workspace }}/.cargo/ci.toml" check ${{ env[matrix.target.options] }} --profile ${{ matrix.workspace.profile }}
        
      - name: cargo clippy
        if: contains(matrix.target.steps, 'clippy') && !contains(matrix.workspace.skip, 'clippy')
        working-directory: ${{ matrix.workspace.path }}
        run: |
          rustup component add clippy
          cargo --config "${{ github.workspace }}/.cargo/ci.toml" clippy ${{ env[matrix.target.options] }} --profile ${{ matrix.workspace.profile }} -- ${{ env['CLIPPY_OPTIONS'] }}

      - name: cargo build
        if: contains(matrix.target.steps, 'build') && !contains(matrix.workspace.skip, 'build')
        working-directory: ${{ matrix.workspace.path }}
        run: cargo --config "${{ github.workspace }}/.cargo/ci.toml" build ${{ env[matrix.target.options] }} --profile ${{ matrix.workspace.profile }}

      - name: cargo test
        if: contains(matrix.target.steps, 'test') && !contains(matrix.workspace.skip, 'test')
        working-directory: ${{ matrix.workspace.path }}
        run: cargo --config "${{ github.workspace }}/.cargo/ci.toml" test ${{ env[matrix.target.options] }} --profile ${{ matrix.workspace.profile }}

      - name: cargo test --doc
        if: contains(matrix.target.steps, 'doctest') && !contains(matrix.workspace.skip, 'doctest')
        working-directory: ${{ matrix.workspace.path }}
        run: cargo --config "${{ github.workspace }}/.cargo/ci.toml" test --workspace --doc --profile ${{ matrix.workspace.profile }}

      - name: Upload Build Artifact
        if: contains(matrix.target.steps, 'artifact') && !contains(matrix.workspace.skip, 'artifact')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: &nu_artifact_name "nu-${{ github.event.number || github.ref_name }}-${{ fromJSON(env.OS_NAMES)[runner.os] }}-${{ fromJson(env.ARCH_NAMES)[runner.arch] }}"
          path: "${{ matrix.workspace.path }}/target/ci/nu${{ fromJSON(env.EXE_SUFFIXES)[runner.os] }}"
          retention-days: 14

      - &assert_clean_repo
        name: Assert Clean Repo
        run: git diff --quiet && git diff --cached --quiet

  std:
    if: *run_ci
    needs: cargo

    strategy:
      fail-fast: true
      matrix:
        platform:
          - incredibuild-ubuntu-2204
          - macos-latest
          - incredibuild-windows-2022

    runs-on: ${{ matrix.platform }}

    steps:
      - *checkout_repo

      - &download_nushell_build
        name: Download Nushell build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: *nu_artifact_name
          path: ${{ runner.temp }}/nu-bin

      - &make_nushell_executable
        name: Make Nushell executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x "$RUNNER_TEMP/nu-bin/nu"

      - &add_nushell_to_path
        name: Add Nushell to PATH
        shell: bash
        run: printf '%s\n' "$RUNNER_TEMP/nu-bin" >> "$GITHUB_PATH"

      - name: Run standard library tests
        shell: bash
        run: nu -c 'use crates/nu-std/testing.nu; testing run-tests --path crates/nu-std'

      - *assert_clean_repo

  virtualenv:
    if: *run_ci
    needs: cargo

    strategy:
      fail-fast: true
      matrix:
        platform:
          - incredibuild-ubuntu-2204
          - macos-latest
          - incredibuild-windows-2022

    runs-on: ${{ matrix.platform }}

    steps:
      - *checkout_repo
      - *download_nushell_build
      - *make_nushell_executable
      - *add_nushell_to_path

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install virtualenv
        run: pip install virtualenv

      - name: Test Nushell in virtualenv
        run: nu scripts/test_virtualenv.nu

      - *assert_clean_repo
